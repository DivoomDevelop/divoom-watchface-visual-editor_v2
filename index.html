<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Divoom 表盘 PC 预览与编辑器</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div style="padding:12px 16px;background:#ffefc2;color:#6a4300;font-weight:700;border-bottom:1px solid #e8c983;">
    重要提示：新架构入口是 modern-editor，
    <a href="./modern-editor/" style="color:#8a2d00;text-decoration:underline;">请点击这里进入</a>
  </div>
  <header class="topbar">
    <div class="title-wrap">
      <h1 id="app-title">Divoom 表盘 PC 预览与编辑器</h1>
      <p id="app-subtitle">加载表盘 JSON，在 PC 上预览并编辑后再下发设备。</p>
    </div>
    <div class="top-actions">
      <label class="lang-switch" for="select-lang">
        <span id="lbl-lang">语言</span>
        <select id="select-lang"></select>
      </label>
      <button id="btn-load-defaults" type="button">重新读取 html/font/font_info.cfg</button>
      <button id="btn-load-sample" type="button">加载示例表盘</button>
      <button id="btn-export-config" type="button">导出当前配置</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel left-panel">
      <section class="card">
        <h2 id="sec-config-title">1) 表盘配置</h2>
        <div class="field-row">
          <label id="lbl-input-config-file" for="input-config-file">加载表盘配置(JSON)</label>
          <input id="input-config-file" type="file" accept=".json,application/json" />
        </div>
      </section>

      <section class="card">
        <h2 id="sec-template-title">模板列表</h2>
        <div class="field-row">
          <label id="lbl-template-category" for="select-template-category">模板分类</label>
          <select id="select-template-category"></select>
        </div>
        <div class="field-row">
          <label id="lbl-template-filter" for="input-template-filter">过滤模板 ID</label>
          <input id="input-template-filter" type="text" placeholder="输入模板 ID 关键字" />
        </div>
        <div class="btn-row">
          <button id="btn-reload-templates" type="button">刷新模板列表</button>
        </div>
        <div id="template-hint" class="hint">模板列表加载中...</div>
        <ul id="template-list" class="template-list"></ul>
      </section>

      <section class="card">
        <h2 id="sec-canvas-title">2) 画布与底图</h2>
        <div class="grid-2">
          <div class="field-row">
            <label id="lbl-input-width" for="input-width">宽度</label>
            <input id="input-width" type="number" min="64" max="4000" step="1" value="800" />
          </div>
          <div class="field-row">
            <label id="lbl-input-height" for="input-height">高度</label>
            <input id="input-height" type="number" min="64" max="4000" step="1" value="1280" />
          </div>
        </div>
        <div class="field-row">
          <label id="lbl-input-zoom" for="input-zoom">缩放(%)</label>
          <input id="input-zoom" type="range" min="20" max="180" value="55" />
          <span id="txt-zoom">55%</span>
        </div>
        <div class="field-row">
          <label id="lbl-input-bg-file" for="input-bg-file">选择底图</label>
          <input id="input-bg-file" type="file" accept="image/*" />
        </div>
        <div class="btn-row">
          <button id="btn-clear-bg" type="button">清除底图</button>
          <button id="btn-fit-resolution" type="button">应用分辨率</button>
        </div>
      </section>

    </aside>

    <section class="panel center-panel">
      <div class="canvas-toolbar">
        <div><span id="lbl-current-clock">当前表盘：</span><span id="txt-clock-title">未加载</span></div>
        <div><span id="lbl-clock-id">ClockId:</span> <span id="txt-clock-id">-</span></div>
        <div><span id="lbl-item-count">元素数:</span> <span id="txt-item-count">0</span></div>
      </div>
      <div id="preview-stage" class="preview-stage">
        <canvas id="watchface-canvas" width="800" height="1280"></canvas>
      </div>
      <div class="legend">
        <span id="legend-image" class="legend-chip image">图片/网络元素占位</span>
        <span id="legend-text" class="legend-chip text">文本元素</span>
        <span id="legend-pointer" class="legend-chip pointer">指针元素</span>
      </div>
    </section>

    <aside class="panel right-panel">
      <section class="card">
        <h2 id="sec-itemlist-title">3) 显示元素(ItemList)</h2>
        <div class="btn-row">
          <button id="btn-add-item" type="button">新增</button>
          <button id="btn-dup-item" type="button">复制</button>
          <button id="btn-del-item" type="button">删除</button>
          <button id="btn-item-up" type="button">上移</button>
          <button id="btn-item-down" type="button">下移</button>
        </div>
        <ul id="item-list" class="item-list"></ul>
      </section>

      <section class="card">
        <h2 id="sec-editor-title">4) 选中元素编辑</h2>
        <div id="item-editor" class="editor-grid"></div>
      </section>
    </aside>
  </main>

  <template id="tpl-editor-field">
    <label class="editor-field">
      <span class="k"></span>
      <input />
    </label>
  </template>

  <script type="module" src="./app.js?v=202605091126"></script>
</body>
</html>
